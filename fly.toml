# fly.toml app configuration file generated for fly-hole on 2026-11-16T16:21:04-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-hole'
primary_region = 'sjc'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
[env]
  # Pi-hole v6 uses FTLCONF_* env vars (v5 names no longer apply)
  FTLCONF_dns_listeningMode = 'ALL'
  FTLCONF_dns_interface = 'eth0'
  # Read optional custom configs from the volumized /etc/dnsmasq.d
  FTLCONF_misc_etc_dnsmasq_d = 'true'
  PH_VOLUME = '/mnt/ph_data'

[[mounts]]
  source = 'ph_data'
  destination = '/mnt/ph_data'

[http_service]
  internal_port = 80
  force_https = true
  # DNS must stay up; do not scale to zero on idle HTTP traffic
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 80

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = 'tcp'
  internal_port = 53

  [[services.ports]]
    port = 853
    handlers = ['tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 150
    soft_limit = 100

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
